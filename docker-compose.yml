version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_APP_NAME=MECAPRO
      - VITE_API_BACKEND_URL=https://mecapro-backend.orkestr.run
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=orkestr-addon-mecapro-mecapro
      - DB_PORT=5432
      - DB_DATABASE=mecapro
      - DB_USERNAME=orkestr
      - DB_PASSWORD=QnuYwCrd2NhJYpO-rdrBVz5yHD0t7GU9
    depends_on:
      - postgres

  ai-model:
    build:
      context: ./ai-model
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DEBUG=False

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=mecapro
      - POSTGRES_USER=orkestr
      - POSTGRES_PASSWORD=QnuYwCrd2NhJYpO-rdrBVz5yHD0t7GU9
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: