version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_APP_NAME=MECAPRO
      - VITE_API_BACKEND_URL=http://backend:8080
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=mecapro
      - DB_USERNAME=orkestr
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - postgres

  ai-model:
    build: ./ai-model
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DEBUG=False

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=mecapro
      - POSTGRES_USER=orkestr
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: